<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Crunchyroll Dub Finder</title>
  <style>
    body {
      width: 260px;
      padding: 14px;
      margin: 0;
      background: #141519;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .title {
      font-weight: bold;
      color: #ff640a;
      font-size: 14px;
    }
    .badge {
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      background: #424242;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 8px;
      background: #ff640a;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      box-sizing: border-box;
      margin-top: 10px;
    }
    .status-box {
      background: #23252b;
      padding: 10px;
      border-radius: 6px;
      font-size: 11px;
      color: #aaa;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">CR Dub Finder</span>
    <span id="token-badge" class="badge">Checking...</span>
  </div>

  <div class="status-box">
    <div><b>Token Status:</b> <span id="token-desc">Checking...</span></div>
    <div style="margin-top:6px;">Navigate to Crunchyroll's Popular page to start scanning!</div>
  </div>

  <a href="https://www.crunchyroll.com/videos/popular" target="_blank" class="btn">
    Open Popular Page
  </a>

  <script src="popup.js"></script>
</body>
</html>
